# OceanGuard AI configuration
# Same geography as BedWatch Asia (Gulf of Thailand / South China Sea shelf)

region:
  name: "Gulf of Thailand / South China Sea"
  lat_min: 5.0
  lat_max: 23.0
  lon_min: 99.0
  lon_max: 121.0

grid:
  resolution_deg: 0.5

time:
  start_date: "2018-01-01"
  end_date: "2023-12-31"

splits:
  train_end: "2021-12-31"
  valid_end: "2022-12-31"

risk:
  low_max_percentile: 70
  medium_max_percentile: 90
  epsilon: 0.1

models:
  random_state: 42
  n_estimators: 80
  max_depth: 8

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  predictions_dir: "data/predictions"
  outputs_dir: "outputs"
  models_dir: "models"
  comparison_csv: "outputs/model_comparison.csv"
  predictions_csv: "data/predictions/latest_predictions.csv"
  processed_weekly: "data/processed/weekly_grid.csv"
  features_parquet: "data/processed/features.parquet"
  # BedWatch Asia GFW file (repo root), preferred over DEMO
  bedwatch_gfw: "../data/gfw_trawl_effort.csv"
