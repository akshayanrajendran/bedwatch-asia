# OceanGuard AI configuration
# Geographic scope: Atlantic Canada / Gulf of St. Lawrence (configurable for later expansion)

region:
  name: "Gulf of St. Lawrence / Atlantic Canada"
  lat_min: 45.0
  lat_max: 52.0
  lon_min: -67.0
  lon_max: -55.0
  # Narrowed from prompt bbox (40–55, -70–-50) to keep MVP tractable at 0.5°.

grid:
  resolution_deg: 0.5

time:
  # Demo / training window (ISO dates)
  start_date: "2020-01-01"
  end_date: "2024-12-31"

splits:
  # Chronological; adjust automatically if data range differs
  train_end: "2022-12-31"
  valid_end: "2023-12-31"
  # test = everything after valid_end

risk:
  low_max_percentile: 70
  medium_max_percentile: 90
  epsilon: 0.1

models:
  random_state: 42
  n_estimators: 100
  max_depth: 8

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  predictions_dir: "data/predictions"
  outputs_dir: "outputs"
  models_dir: "models"
  comparison_csv: "outputs/model_comparison.csv"
  predictions_csv: "data/predictions/latest_predictions.csv"
  processed_weekly: "data/processed/weekly_grid.csv"
  features_parquet: "data/processed/features.parquet"
